# Configuration for both halves of the deliverable.
#
# EDIT BEFORE APPLYING:
#
#   1. `ans_trusted_authority` / `authorities` — the externally-visible authority
#      callers sign into `htu`. ANS-6 §7.7 compares against THIS, never against the
#      socket the request arrived on, so a caller reaching you on a NodePort still
#      signs `https://agent.example.com/...`. Get it wrong and every request is
#      refused with HTTP_BINDING_MISMATCH.
#
#   2. `root_keys_url` — your reference-implementation Transparency Log. Two shapes:
#        in-cluster : https://ans-tl.ans-demo.svc.cluster.local:8443
#        on the host: https://host.minikube.internal:8443
#      A failed bootstrap fetch is fatal (§4.5): with no key there is nothing to
#      verify against, so ans-authz refuses to start rather than run and deny
#      everything while looking healthy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ans-authz-config
  namespace: ans-demo
data:
  ans-authz.toml: |
    [server]
    # Loopback only. Envoy reaches it in-pod; nothing else should be able to.
    listen = "127.0.0.1:10003"
    admin_listen = "0.0.0.0:9901"

    [authority]
    # §7.7 — the authority comes from a per-route value Envoy asserts via xDS,
    # which the proto says is not forwarded upstream, so a client cannot reach it.
    mode = "context_extension"
    context_extension_key = "ans_trusted_authority"
    # Belt: a proxy-asserted authority outside this list is refused, so a
    # mis-scoped route cannot introduce one nobody intended.
    authorities = ["agent.example.com"]

    [verification]
    methods = "method_b"
    require_receipt = true
    allowed_ans_names = []
    pop_skew_secs = 120
    status_skew_secs = 60
    # §7.13 requires binding on every Method B proof, including empty content.
    # The Envoy filter supplies complete raw bytes through with_request_body.
    content_binding = "required"

    [replay]
    # §7.6 — the only conformant choice above one replica.
    backend = "redis"
    redis_url = "redis://redis.ans-demo.svc.cluster.local:6379"
    key_prefix = "ans6:demo:"
    # §9.6 — a timeout is a rejection, never a skip. Must stay below the Envoy
    # filter's grpc timeout (1s).
    deadline_ms = 200
    max_entries = 100000
    replicas = 2

    [transparency_log]
    # EDIT THIS.
    root_keys_url = "https://host.minikube.internal:8443/root-keys"
    static_root_keys = []
    refresh_interval_secs = 1800
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: ans-demo
data:
  envoy.yaml: |
    # Kubelet readiness probes connect to the pod IP. Keep this admin port
    # private to the cluster; it is not exposed by the gateway Service.
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9902 }

    static_resources:
      listeners:
        - name: ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 8443 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http

                    # §7.3 path fidelity. Envoy hands ext_authz the path AFTER
                    # normalization, and a normalized path is indistinguishable
                    # from one the client sent that way — so ans-authz cannot
                    # detect this and it has to be pinned here.
                    normalize_path: false
                    merge_slashes: false
                    path_with_escaped_slashes_action: KEEP_UNCHANGED

                    route_config:
                      name: local
                      virtual_hosts:
                        - name: agent
                          # "*" so the demo works through a NodePort or a
                          # port-forward, where the Host header is an IP. The
                          # authority that matters for §7.7 is the
                          # context_extension below, not this.
                          domains: ["*"]
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions:
                                  # §7.7. Must match `authorities` above AND the
                                  # origin your callers sign.
                                  ans_trusted_authority: "agent.example.com"
                          routes:
                            - match: { prefix: "/" }
                              route:
                                cluster: agent
                                # No prefix_rewrite / regex_rewrite, ever (§7.3).

                    http_filters:
                      # Before the router, and before anything that transforms the
                      # body, so §7.13 hashes the octets the caller sent.
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          # §4.6 duplicate-header rejection. Without this Envoy
                          # comma-merges same-name headers and the check becomes
                          # impossible; ans-authz then denies EVERY request and
                          # says so on /readyz.
                          encode_raw_headers: true
                          # Fail closed (§7.6, §9.6). Default, stated so a change
                          # shows up in a diff.
                          failure_mode_allow: false
                          status_on_error: { code: ServiceUnavailable }
                          validate_mutations: true
                          include_peer_certificate: false
                          # §7.13. allow_partial_message MUST be false and
                          # pack_as_bytes MUST be true — a prefix hash, or a hash
                          # over UTF-8-replaced bytes, is indistinguishable from
                          # tampering. max_request_bytes is a hard ceiling: above
                          # it Envoy answers 413 itself, which is a rejection
                          # rather than a silent pass.
                          with_request_body:
                            max_request_bytes: 1048576
                            allow_partial_message: false
                            pack_as_bytes: true
                          grpc_service:
                            envoy_grpc: { cluster_name: ans_authz }
                            # NOT the 200ms default: two or three ECDSA
                            # verifications plus a Redis round trip.
                            timeout: 1s
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: ans_authz
          type: STATIC
          connect_timeout: 1s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: ans_authz
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 10003 }

        - name: agent
          type: STRICT_DNS
          connect_timeout: 1s
          load_assignment:
            cluster_name: agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: agent.ans-demo.svc.cluster.local
                          port_value: 8080
