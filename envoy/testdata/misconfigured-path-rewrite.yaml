# NEGATIVE FIXTURE — NOT ANS-6 conformant.
#
# Path normalization on, plus a route rewrite: both change the path the caller
# signed, so `htu` is compared against something the caller never produced
# (§7.3, §11.5).
- name: envoy.filters.network.http_connection_manager
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
    normalize_path: true
    merge_slashes: true
    path_with_escaped_slashes_action: UNESCAPE_AND_REDIRECT
    route_config:
      virtual_hosts:
        - name: api
          routes:
            - match: { prefix: "/" }
              route:
                cluster: agent
                prefix_rewrite: "/v2"
    http_filters:
      - name: envoy.filters.http.ext_authz
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
          encode_raw_headers: true
          grpc_service:
            envoy_grpc: { cluster_name: ans_authz }
            timeout: 1s
